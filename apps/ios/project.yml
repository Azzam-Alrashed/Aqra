name: Aqra
options:
  bundleIdPrefix: com.azzamalrashed
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Aqra:
    type: application
    platform: iOS
    sources:
      - Aqra
      # The shared Quran data, bundled as a "quran" folder (see shared/quran/README.md).
      - path: ../../shared/quran
        type: folder
        buildPhase: resources
      # The Firebase config, bundled as a "Firebase" folder; it isn't in git (see Firebase/README.md).
      - path: Firebase
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Aqra/Aqra.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azzamalrashed.aqra
        DEVELOPMENT_TEAM: 6QYT6GJB4Z
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_IDENTITY: iPhone Developer
        GENERATE_INFOPLIST_FILE: YES
        # Only what the generated Info.plist can't hold: the URL scheme Google's sign-in returns to.
        INFOPLIST_FILE: Aqra/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "اقْرَأْ"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Video tasmee' and scanning a friend's code (localized in InfoPlist.xcstrings).
        INFOPLIST_KEY_NSCameraUsageDescription: "Your teacher sees you while you recite, and you can scan a friend's code."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Your teacher hears you recite in a video tasmee'."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  AqraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AqraTests]
    dependencies:
      - target: Aqra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aqra:
    build:
      targets:
        Aqra: all
        AqraTests: [test]
    run:
      commandLineArguments:
        # Tick it in the scheme's Run arguments to use the local Firebase emulators (see backend/README.md).
        "-UseFirebaseEmulator": false
    test:
      targets: [AqraTests]
